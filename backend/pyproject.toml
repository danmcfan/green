[project]
name = "green"
version = "0.1.0"
description = "Pipeline that predicts NDVI from soil and climate Input layers"
authors = [
    { name = "Danny O'Brien", email = "danmcfan33@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
green = "green:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
