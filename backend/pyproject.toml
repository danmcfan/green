[project]
name = "green"
version = "0.1.0"
description = "Pipeline that predicts NDVI from soil and climate Input layers"
authors = [
    { name = "Danny O'Brien", email = "danmcfan33@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "earthengine-api>=1.7.47",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pmtiles>=3.8.1",
    "pyshp>=3.1.6",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
]

[project.scripts]
green = "green:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
