version: '3'

dotenv: ['.env']

tasks:
  setup:
    desc: Install backend and frontend dependencies
    cmds:
      - test -f .env || cp .env.example .env
      - uv sync --directory backend
      - bun install --cwd frontend --frozen-lockfile

  dev:
    desc: Run the frontend dev server
    dir: frontend
    cmd: bun run dev {{.CLI_ARGS}}

  tiles:local:
    desc: "Serve the pipeline's PMTiles from the dev server, e.g. task tiles:local REGION=conus"
    dir: frontend
    vars:
      REGION: '{{.REGION | default "small"}}'
    cmd: bun scripts/tiles.ts stage ../tiles/{{.REGION}} public/tiles

  lint:
    desc: Lint backend and frontend
    cmds:
      - task: lint:backend
      - task: lint:frontend

  lint:backend:
    dir: backend
    cmds:
      - uv run ruff check
      - uv run ruff format --check

  lint:frontend:
    dir: frontend
    cmds:
      - bun run format:check
      - bun run lint
      - bun run typecheck
      - bun run knip

  format:
    desc: Format backend and frontend code
    cmds:
      - task: format:backend
      - task: format:frontend

  format:backend:
    dir: backend
    cmd: uv run ruff format

  format:frontend:
    dir: frontend
    cmd: bun run format

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    dir: backend
    cmd: uv run pytest

  test:frontend:
    dir: frontend
    cmd: bun run test

  pipeline:
    desc: "Run the backend pipeline, e.g. task pipeline -- run --region small --source synthetic"
    dir: backend
    cmd: uv run green {{.CLI_ARGS}}

  pipeline:watch:
    desc: "Show a live view of a pipeline log's progress and problems, e.g. task pipeline:watch LOG=run.log"
    dir: backend
    cmd: uv run green watch --log {{.ROOT_DIR}}/{{.LOG | default "run.log"}}

  pipeline:fixture:
    desc: Run the full pipeline on a small region with synthetic data and produce PMTiles
    dir: backend
    cmd: uv run green run --region small --source synthetic --start 2010 --end 2013 --block-km 25

  pipeline:clear:
    desc: "Delete a region's saved extract data, e.g. task pipeline:clear REGION=conus -- --only land_cover ndvi/2012"
    dir: backend
    cmd: uv run green clear --region {{.REGION | default "small"}} {{.CLI_ARGS}}

  build:
    desc: Typecheck and build the frontend
    dir: frontend
    cmd: bun run build

  check:
    desc: Everything CI runs
    cmds:
      - task: lint
      - task: test
      - task: build
